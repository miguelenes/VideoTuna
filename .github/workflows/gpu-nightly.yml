name: GPU Nightly

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Override self-hosted runner label"
        type: string
        default: ""
        required: false
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC

concurrency:
  group: gpu-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  VIDEOTUNA_ATTN_BACKEND: sdpa
  VIDEOTUNA_COMPUTE_BACKEND: cuda
  VIDEOTUNA_TORCH_COMPILE: "0"

jobs:
  gpu-smoke:
    runs-on: >-
      ${{ github.event.inputs.runner
          && fromJSON(format('["self-hosted","gpu","{0}"]', github.event.inputs.runner))
          || fromJSON('["self-hosted","gpu"]') }}
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: poetry

      - name: Install Poetry
        run: pip install "poetry==2.1.3"

      - name: Install dependencies (CUDA extra + training)
        run: poetry install -E cuda --with training

      - name: Install DeepSpeed
        run: poetry run install-deepspeed

      - name: GPU environment info
        run: |
          poetry run python -c "
          import torch
          print(f'PyTorch {torch.__version__}')
          print(f'CUDA available: {torch.cuda.is_available()}')
          if torch.cuda.is_available():
              print(f'GPU count: {torch.cuda.device_count()}')
              for i in range(torch.cuda.device_count()):
                  props = torch.cuda.get_device_properties(i)
                  print(f'  [{i}] {props.name} ({props.total_mem / 1e9:.1f} GB)')
          "

      - name: Import smoke (GPU backends)
        id: import-smoke
        run: poetry run pytest tests/test_import_smoke.py -q -v -k "gpu"

      - name: Bridge validation (GPU)
        id: bridge-validation
        run: >-
          poetry run pytest tests/test_wan_lora_bridge.py::test_validate_domain_t2v_gpu_smoke -q -v

      - name: Diffusers video flow GPU smoke
        id: flow-gpu-smoke
        run: poetry run pytest tests/test_diffusers_video_flow.py -q -v -m gpu

      - name: Wan 2.2 4-step smoke (GPU)
        id: wan22-smoke
        run: |
          poetry run inference-wan2.2-t2v-720p \
            --model-id Wan-AI/Wan2.2-T2V-A14B-Diffusers \
            --height 256 \
            --width 448 \
            --frames 5 \
            --num-inference-steps 4 \
            --guidance-scale 5.0 \
            --seed 42 \
            --dtype bf16 \
            --savefps 8 \
            --savedir results/gpu-nightly/smoke \
            --prompt-file inputs/t2v/prompts.txt
        env:
          VIDEOTUNA_ATTN_BACKEND: sdpa

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-nightly-outputs
          path: |
            results/gpu-nightly/**/*.png
            results/gpu-nightly/**/*.mp4
          if-no-files-found: warn

      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-nightly-metrics
          path: |
            results/gpu-nightly/**/metrics.json
          if-no-files-found: ignore
