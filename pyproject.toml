[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true

[tool.ruff]
select = ["E", "F", "C90"]
ignore = []
