inference-opensora-v2 = 'scripts:inference_opensora_v2'
inference-ltx-t2v = 'scripts:inference_ltx_t2v'
"inference-wan2.2-t2v-720p" = 'scripts:inference_wan2_2_t2v_720p'
"inference-wan2.2-i2v-720p" = 'scripts:inference_wan2_2_i2v_720p'
inference-v2v-ms = 'scripts:inference_v2v_ms'
inference-vc1-i2v-320x512 = 'scripts:inference_vc1_i2v_320x512'
