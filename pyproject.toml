[tool.poetry]
name = "videotuna"
version = "0.1.0"
description = "Videotuna is a useful codebase for text-to-video applications"
authors = [
    "Yingqing He <yhebm@connect.ust.hk>",
    "Yazhou Xing <yxingag@connect.ust.hk>",
]
readme = "README.md"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.11"
deepspeed = "0.19.2"
av = "12.3.0"
beautifulsoup4 = "4.12.3"
colossalai = "0.3.6"
peft = "^0.17.0"
bitsandbytes = "^0.45.0"
decord = "0.6.0"
einops = "0.8.0"
fire = "0.6.0"
torch = { version = "^2.6.0", source = "pytorch-cu126" }
triton = { version = "3.2.0", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cublas-cu12 = { version = "12.6.4.1", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cuda-cupti-cu12 = { version = "12.6.80", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cuda-nvrtc-cu12 = { version = "12.6.77", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cuda-runtime-cu12 = { version = "12.6.77", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cudnn-cu12 = { version = "9.5.1.17", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cufft-cu12 = { version = "11.3.0.4", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-curand-cu12 = { version = "10.3.7.77", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cusolver-cu12 = { version = "11.7.1.2", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cusparse-cu12 = { version = "12.5.4.2", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-cusparselt-cu12 = { version = "0.6.3", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-nccl-cu12 = { version = "2.21.5", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-nvjitlink-cu12 = { version = "12.6.85", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
nvidia-nvtx-cu12 = { version = "12.6.77", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
ftfy = "6.2.3"
huggingface-hub = "^0.34.0"
loguru = "0.7.2"
imwatermark = "0.0.2"
kornia = "0.7.3"
mmengine = "0.10.4"
omegaconf = "2.3.0"
opencv-python = "4.10.0.84"
packaging = "24.1"
pandas = "2.2.2"
pillow = "10.4.0"
pudb = "2024.1.2"
pytorch-lightning = "2.4.0"
pyyaml = "6.0.2"
rotary-embedding-torch = "0.6.5"
requests = "2.32.3"
safetensors = "^0.5.0"
timm = "1.0.8"
torchvision = { version = "^0.21.0", source = "pytorch-cu126" }
tqdm = "4.66.5"
transformers = "^4.48.0"
xformers = { version = "0.0.29.post3", source = "pytorch-cu126" }
imageio = "2.35.1"
imageio-ffmpeg = "0.5.1"
pyramid = "1.5"
wandb = "0.17.8"
scipy = "1.14.1"
beartype = "0.18.5"
moviepy = "1.0.3"
open-clip-torch = "2.12.0"
numpy = ">=1.26,<3"
diffusers = "^0.36.0"
torchsde = "0.2.6"
colorama = "0.4.6"
torch-optimi = "^0.2.1"
accelerate = "^1.2.0"
torchao = "^0.9.0"
toml = "0.10.2"
hpsv2 = { git = "https://github.com/tgxs002/HPSv2.git" }
backports-tarfile = "^1.2.0"
swissarmytransformer = { git = "https://github.com/JingyeChen/SwissArmyTransformer" }
pydantic-settings = "^2.8.0"
xfuser = "^0.4.4"
dashscope = "^1.23.0"
tensorboard = "^2.19.0"
easydict = "^1.13"
scikit-learn = "^1.6.1"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
isort = "^5.12.0"
mypy = "^1.11.2"
pytest = "7.2.0"
pre-commit = "^4.1.0"
coverage = "^7.6.1"
ruff = "^0.6.8"

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[[tool.poetry.source]]
name = "modelscope"
url = "https://modelscope.oss-cn-beijing.aliyuncs.com/releases/repo.html"
priority = "supplemental"

[tool.poetry.scripts]
install-deepspeed = 'scripts:install_deepspeed'
install-flash-attn = 'scripts:install_flash_attn'
coverage-report = 'scripts:coverage_report'
format = 'scripts:code_format'
format-check = 'scripts:code_format_check'
lint = 'scripts:lint'
benchmark-attn-backends = 'scripts:benchmark_attn_backends'
test = 'scripts:test'
type-check = 'scripts:type_check'
inference-stepvideo-t2v-544x992 = 'scripts:inference_stepvideo_t2v_544x992'
inference-wanvideo-i2v-720p = 'scripts:inference_wanvideo_i2v_720p'
inference-wanvideo-t2v-720p = 'scripts:inference_wanvideo_t2v_720p'
inference-hunyuan-i2v-720p = 'scripts:inference_hunyuan_i2v_720p'
inference-cogvideo-i2v-diffusers = 'scripts:inference_cogvideo_i2v_diffusers'
inference-cogvideo-i2v-lora = 'scripts:inference_cogvideo_i2v_lora'
inference-cogvideo-lora = 'scripts:inference_cogvideo_lora'
inference-cogvideo-t2v-diffusers = 'scripts:inference_cogvideo_t2v_diffusers'
inference-cogvideox-15-5b-i2v = 'scripts:inference_cogvideox1_5_5b_i2v'
