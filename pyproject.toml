inference-flux2-klein-9b = 'scripts:inference_flux2_klein_9b'
inference-flux-lora = 'scripts:inference_flux_lora'
inference-hunyuan-t2v = 'scripts:inference_hunyuan_t2v'
inference-hunyuan-t2v-diffusers = 'scripts:inference_hunyuan_t2v_diffusers'
"inference-hunyuan1.5-t2v" = 'scripts:inference_hunyuan1_5_t2v'
"inference-hunyuan1.5-i2v" = 'scripts:inference_hunyuan1_5_i2v'
