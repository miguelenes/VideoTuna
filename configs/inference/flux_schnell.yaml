flow:
  target: videotuna.flow.diffusers_video.DiffusersVideoFlow
  params:
    model_family: flux
    mode: t2i
    pipeline_only: true
    model_variant: 2-klein-9b
    pretrained_model_name_or_path: black-forest-labs/FLUX.2-klein-9B
inference:
  mode: t2i
  ckpt_path: black-forest-labs/FLUX.2-klein-9B
  savedir: results/t2i/flux2-klein-9b
  prompt_file: inputs/t2v/prompts.txt
  height: 768
  width: 1360
  num_inference_steps: 4
  unconditional_guidance_scale: 4.0
  seed: 42
  enable_model_cpu_offload: true
  dtype: bf16
