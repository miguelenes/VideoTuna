# CPU smoke preset for HunyuanVideo 1.5 Diffusers T2V (dev/CI only)
# Usage:
#   poetry run inference-hunyuan1.5-t2v \
#     --config configs/inference/presets/hunyuan1_5_cpu_smoke.yaml --cpu-smoke
flow:
  target: videotuna.flow.diffusers_video.DiffusersVideoFlow
  params:
    model_family: hunyuan
    mode: t2v
    pipeline_only: true
    model_variant: "720p"
    pretrained_model_name_or_path: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v
inference:
  mode: t2v
  device: cpu
  ckpt_path: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v
  savedir: results/t2v/hunyuan1.5-cpu-smoke
  prompt_file: inputs/t2v/prompts.txt
  frames: 2
  height: 256
  width: 256
  num_inference_steps: 4
  seed: 42
  savefps: 8
  dtype: fp32
