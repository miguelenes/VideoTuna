# CPU smoke preset for CogVideoX 2B (dev/CI only — not for production)
# Usage:
#   poetry run inference-cogvideo-t2v-diffusers \
#     --config configs/inference/presets/cogvideox_2b_cpu_smoke.yaml --cpu-smoke
flow:
  target: videotuna.flow.diffusers_video.DiffusersVideoFlow
  params:
    model_family: cogvideox
    mode: t2v
    pipeline_only: true
    pretrained_model_name_or_path: THUDM/CogVideoX-2b
    model_variant: "2b"
inference:
  mode: t2v
  device: cpu
  ckpt_path: THUDM/CogVideoX-2b
  savedir: results/t2v/cogvideox-2b-cpu-smoke
  prompt_file: inputs/t2v/prompts.txt
  frames: 2
  height: 256
  width: 256
  num_inference_steps: 4
  unconditional_guidance_scale: 6.0
  seed: 42
  savefps: 8
  dtype: fp32
