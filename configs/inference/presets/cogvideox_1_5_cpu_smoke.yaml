# CPU smoke preset for CogVideoX 1.5 T2V (dev/CI only — not for production)
# Usage:
#   poetry run inference-cogvideox1.5-t2v \
#     --config configs/inference/presets/cogvideox_1_5_cpu_smoke.yaml --cpu-smoke
flow:
  target: videotuna.flow.diffusers_video.DiffusersVideoFlow
  params:
    model_family: cogvideox
    mode: t2v
    pipeline_only: true
    model_variant: "1.5"
    pretrained_model_name_or_path: THUDM/CogVideoX1.5-5B
inference:
  mode: t2v
  device: cpu
  ckpt_path: THUDM/CogVideoX1.5-5B
  savedir: results/t2v/cogvideox1.5-cpu-smoke
  prompt_file: inputs/t2v/prompts.txt
  frames: 2
  height: 256
  width: 256
  num_inference_steps: 4
  unconditional_guidance_scale: 6.0
  seed: 42
  savefps: 8
  dtype: fp32
