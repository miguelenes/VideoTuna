# Balanced preset for HunyuanVideo 1.5 Diffusers 720p
flow:
  target: videotuna.flow.diffusers_video.DiffusersVideoFlow
  params:
    model_family: hunyuan
    mode: t2v
    pipeline_only: true
    model_variant: "720p"
    pretrained_model_name_or_path: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v
inference:
  mode: t2v
  ckpt_path: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v
  savedir: results/t2v/hunyuan1.5-720p-balanced
  prompt_file: inputs/t2v/prompts.txt
  frames: 121
  height: 720
  width: 1280
  num_inference_steps: 50
  unconditional_guidance_scale: 6.0
  seed: 42
  savefps: 24
  memory_preset: balanced
  enable_model_cpu_offload: true
  enable_vae_tiling: true
  dtype: bf16
