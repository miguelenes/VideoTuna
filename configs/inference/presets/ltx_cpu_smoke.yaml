# CPU smoke preset for LTX-Video T2V (dev/CI only — not for production)
# Usage:
#   poetry run inference-ltx-t2v \
#     --config configs/inference/presets/ltx_cpu_smoke.yaml --cpu-smoke
flow:
  target: videotuna.flow.diffusers_video.DiffusersVideoFlow
  params:
    model_family: ltx
    mode: t2v
    pipeline_only: true
    pretrained_model_name_or_path: Lightricks/LTX-Video
inference:
  mode: t2v
  device: cpu
  ckpt_path: Lightricks/LTX-Video
  savedir: results/t2v/ltx-cpu-smoke
  prompt_file: inputs/t2v/prompts.txt
  frames: 2
  height: 256
  width: 256
  num_inference_steps: 4
  unconditional_guidance_scale: 5.0
  seed: 42
  savefps: 8
  dtype: fp32
