# CPU init-only smoke for native Hunyuan flow (debug checkpoint loading — not full denoise)
# Requires local checkpoints; use --cpu-smoke or VIDEOTUNA_CPU_MODE=force
# Usage:
#   poetry run inference-hunyuan-t2v \
#     --config configs/inference/presets/hunyuan_init_cpu_smoke.yaml --cpu-smoke
flow:
  target: videotuna.flow.hunyuanvideo.HunyuanVideoFlow
  params:
    model_variant: t2v
    precision: fp16
    rope_theta: 256
    time_shift: 7.0
    i2v_mode: false
    use_cpu_offload: false
    use_model_cpu_offload: false
    vae_type: 884-16c-hy
    vae_precision: fp16
    vae_tiling: false
    ckpt_path: checkpoints/hunyuanvideo/HunyuanVideo
    denoiser_ckpt_path: ${flow.params.ckpt_path}
    dit_weight: ${flow.params.ckpt_path}/hunyuan-video-t2v-720p/transformers/mp_rank_00_model_states.pt
    first_stage_ckpt_path: ${flow.params.ckpt_path}/hunyuan-video-t2v-720p/vae
    use_fp8: false
    ulysses_degree: 1
    ring_degree: 1
inference:
  mode: t2v
  device: cpu
  ckpt_path: ${flow.params.ckpt_path}
  savedir: results/t2v/hunyuan-cpu-init-smoke
  prompt_file: inputs/t2v/prompts.txt
  frames: 1
  height: 256
  width: 256
  ddim_steps: 2
  seed: 42
  savefps: 8
  dtype: fp16
